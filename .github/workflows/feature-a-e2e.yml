name: Feature A E2E causal e regressao

on:
  workflow_dispatch:
    inputs:
      evidence_recipient:
        description: Chave publica age1... para criptografar logs e traces
        required: true
        type: string

permissions:
  contents: read

jobs:
  feature-a-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      SENTRY_DSN: "off"
      META_GRAPH_BASE_URL: http://127.0.0.1:9
      META_ADS_GRAPH_BASE_URL: http://127.0.0.1:9
      WAHA_WEBHOOK_REQUIRE_SIGNATURE: "false"
      NODE_OPTIONS: --max-old-space-size=4096
      EVIDENCE_RECIPIENT: ${{ inputs.evidence_recipient }}
    steps:
      - name: Checkout do commit exato do produto
        uses: actions/checkout@v7
        with:
          repository: oianmaxdev/DeskcommCRM
          ref: 4d76349977ed5196a90c00722c240ae4764af747
          persist-credentials: false

      - name: Confirmar identidade do checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '4d76349977ed5196a90c00722c240ae4764af747'
          test ! -e .env.local
          test -f .github/actions/preparar-node/action.yml
          test -f supabase/baseline.sql
          test -f tests/e2e/conversa-vira-lead.spec.ts
          test -f tests/e2e/conversoes-reprocessamento.spec.ts
          test -f tests/e2e/meta-lead-submitted-causal.spec.ts

      - name: Preparar criptografia dos artefatos
        id: encryption
        run: |
          set -euo pipefail
          umask 077
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq age >/dev/null
          mkdir -p "$RUNNER_TEMP/feature-a-evidence"
          printf 'teste\n' | age -r "$EVIDENCE_RECIPIENT" -o "$RUNNER_TEMP/feature-a-evidence/recipient-probe.age"
          test -s "$RUNNER_TEMP/feature-a-evidence/recipient-probe.age"
          printf '%s\n' 'Criptografia de evidencias pronta.'

      - name: Reservar portas locais do Supabase
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          config = Path('supabase/config.toml')
          original = config.read_text()
          updated, count = re.subn(r'(?m)^(\[db\]\nport = )54322$',
                                   r'\g<1>15432', original)
          if count != 1:
              raise SystemExit('Porta original do banco inesperada; configuracao local nao alterada')
          config.write_text(updated)
          PY
          portas=$(grep -oE '^[[:space:]]*(shadow_)?port[[:space:]]*=[[:space:]]*[0-9]+' supabase/config.toml \
            | grep -oE '[0-9]+$' | sort -un | paste -sd, -)
          test -n "$portas"
          sudo sysctl -w net.ipv4.ip_local_reserved_ports="$portas" >/dev/null

      - uses: ./.github/actions/preparar-node
        timeout-minutes: 5

      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Diagnosticar portas locais antes do Supabase
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/feature-a-evidence/ports-before-start.log"
          {
            date -u +'%Y-%m-%dT%H:%M:%SZ'
            printf 'Faixa de portas efemeras: '
            cat /proc/sys/net/ipv4/ip_local_port_range
            printf '\nListeners TCP (enderecos, portas e nomes de processos):\n'
            ss -H -ltnp
            printf '\nContainers Docker e portas publicadas:\n'
            docker ps --format '{{.Names}} {{.Ports}}'
          } > "$log" 2>&1
          python3 - <<'PY' >> "$log" 2>&1
          import socket
          import tomllib
          from pathlib import Path

          config = tomllib.loads(Path('supabase/config.toml').read_text())
          ports = {15432, config['api']['port'], config['db']['port'],
                   config['db']['shadow_port'], config['db']['pooler']['port'],
                   config['studio']['port'], config['inbucket']['port']}
          if config['db']['port'] != 15432:
              raise SystemExit('Porta do banco de QA inesperada')
          busy = []
          for port in sorted(ports):
              with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as listener:
                  try:
                      listener.bind(('0.0.0.0', port))
                  except OSError as error:
                      busy.append(port)
                      print(f'Porta {port} indisponivel para bind: {error.strerror}')
                  else:
                      print(f'Porta {port} livre para bind IPv4')
          if busy:
              raise SystemExit('Portas do Supabase indisponiveis: ' + ', '.join(map(str, busy)))
          PY

      - name: Subir Supabase descartavel sem migrations
        run: |
          set -euo pipefail
          mv supabase/migrations "$RUNNER_TEMP/feature-a-migrations"
          mkdir -p supabase/migrations
          log="$RUNNER_TEMP/feature-a-evidence/supabase-start.log"
          esperas=(0 20 60 120)
          registros=(ghcr.io public.ecr.aws ghcr.io public.ecr.aws)
          for tentativa in 1 2 3 4; do
            espera=${esperas[$((tentativa - 1))]}
            registro=${registros[$((tentativa - 1))]}
            tentativa_log="$RUNNER_TEMP/feature-a-evidence/supabase-start-${tentativa}.log"
            if [ "$espera" -gt 0 ]; then
              supabase stop --no-backup >> "$log" 2>&1 || true
              sleep "$espera"
            fi
            if SUPABASE_INTERNAL_IMAGE_REGISTRY="$registro" supabase start -x studio,postgres-meta > "$tentativa_log" 2>&1; then
              cat "$tentativa_log" >> "$log"
              curl -fsS -o /dev/null http://127.0.0.1:54321/auth/v1/health
              exit 0
            fi
            cat "$tentativa_log" >> "$log"
            {
              date -u +'%Y-%m-%dT%H:%M:%SZ'
              ss -H -ltnp
              docker ps --format '{{.Names}} {{.Ports}}'
            } > "$RUNNER_TEMP/feature-a-evidence/ports-after-start-failure-${tentativa}.log" 2>&1
            if ! grep -qE 'toomanyrequests|failed to pull docker image|error pulling image|TLS handshake timeout|i/o timeout|connection reset by peer' "$tentativa_log"; then
              echo 'Supabase local falhou; detalhe no artefato criptografado.' >&2
              exit 1
            fi
          done
          echo 'Supabase local falhou apos quatro tentativas de download; detalhe no artefato criptografado.' >&2
          exit 1

      - name: Restaurar migrations do checkout para os testes
        run: |
          set -euo pipefail
          origem="$RUNNER_TEMP/feature-a-migrations"
          test -f "$origem/MANIFEST.md"
          test -d supabase/migrations
          test -z "$(find supabase/migrations -mindepth 1 -print -quit)"
          rmdir supabase/migrations
          mv "$origem" supabase/migrations
          test -f supabase/migrations/MANIFEST.md
          test "$(git status --porcelain -- supabase/migrations | wc -l)" -eq 0

      - name: Preparar extensoes, baseline e chave local
        run: |
          set -euo pipefail
          db='postgresql://postgres:postgres@127.0.0.1:15432/postgres'
          log="$RUNNER_TEMP/feature-a-evidence/baseline.log"
          psql "$db" -v ON_ERROR_STOP=1 -q > "$log" 2>&1 <<'SQL'
          create schema if not exists extensions;
          create extension if not exists "uuid-ossp" with schema extensions;
          create extension if not exists pgcrypto with schema extensions;
          create extension if not exists vector with schema public;
          create extension if not exists citext with schema public;
          create extension if not exists pg_trgm with schema public;
          SQL
          psql "$db" -v ON_ERROR_STOP=1 -q -f supabase/baseline.sql >> "$log" 2>&1
          psql "$db" -v ON_ERROR_STOP=1 -q \
            -c "insert into private.app_secrets (name, value) values ('nuvemshop_oauth_key', '$(openssl rand -hex 32)') on conflict (name) do nothing;" \
            >> "$log" 2>&1

      - name: Reiniciar Realtime depois da publication do baseline
        run: |
          set -euo pipefail
          id=$(docker ps -q --filter name=supabase_realtime)
          test -n "$id"
          docker restart "$id" >/dev/null
          for i in $(seq 1 30); do
            estado=$(docker inspect -f '{{.State.Health.Status}}' "$id" 2>/dev/null || true)
            if [ "$estado" = healthy ]; then exit 0; fi
            sleep 2
          done
          echo 'Realtime nao ficou healthy.' >&2
          exit 1

      - name: Gerar e validar ambiente E2E local
        run: |
          set -euo pipefail
          pnpm e2e:env > "$RUNNER_TEMP/feature-a-evidence/e2e-env.log" 2>&1
          python3 - <<'PY'
          import os
          from pathlib import Path
          from urllib.parse import urlparse

          env = {}
          for line in Path('.env.e2e').read_text().splitlines():
              if not line or line.lstrip().startswith('#') or '=' not in line:
                  continue
              key, value = line.split('=', 1)
              env[key] = value
          collision = {'META_GRAPH_BASE_URL', 'META_ADS_GRAPH_BASE_URL',
                       'WAHA_WEBHOOK_REQUIRE_SIGNATURE'} & env.keys()
          if collision:
              raise SystemExit('Variaveis de guarda presentes em .env.e2e: ' + ', '.join(sorted(collision)))
          expected = {
              'NEXT_PUBLIC_SUPABASE_URL': ('127.0.0.1', 54321),
              'SUPABASE_DB_URL': ('127.0.0.1', 15432),
              'NEXT_PUBLIC_APP_URL': ('localhost', 3001),
              'WAHA_API_BASE_URL': ('127.0.0.1', 3999),
          }
          for key, (host, port) in expected.items():
              parsed = urlparse(env.get(key, ''))
              if parsed.hostname != host or parsed.port != port:
                  raise SystemExit(f'Destino local invalido: {key}')
          for key, value in env.items():
              if key.endswith(('_URL', '_URI', '_HOST', '_ENDPOINT')) and value:
                  if urlparse(value).hostname not in ('127.0.0.1', 'localhost', '::1'):
                      raise SystemExit(f'Destino nao local: {key}')
          if env.get('SENTRY_DSN') != 'off':
              raise SystemExit('Sentry precisa estar desligado')
          if os.environ.get('META_GRAPH_BASE_URL') != 'http://127.0.0.1:9':
              raise SystemExit('Graph do canal nao esta bloqueada em loopback')
          if os.environ.get('META_ADS_GRAPH_BASE_URL') != 'http://127.0.0.1:9':
              raise SystemExit('Graph de anuncios padrao nao esta bloqueada em loopback')
          if os.environ.get('WAHA_WEBHOOK_REQUIRE_SIGNATURE') != 'false':
              raise SystemExit('WAHA padrao precisa permanecer sem assinatura obrigatoria')
          PY
          grep -vE '^[[:space:]]*(#|$)' .env.e2e >> "$GITHUB_ENV"
          echo 'Ambiente E2E conferido: somente destinos locais.'

      - name: Typecheck completo do produto
        id: typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/feature-a-evidence"
          metrics="$evidence/memory-typecheck.log"
          summary="$evidence/typecheck-metrics.log"
          started=$(date +%s)
          pnpm typecheck > "$evidence/typecheck.log" 2>&1 &
          typecheck_pid=$!
          (
            while kill -0 "$typecheck_pid" 2>/dev/null; do
              date -u +'%Y-%m-%dT%H:%M:%SZ'
              awk '/^MemAvailable:/ {available=$2} /^SwapTotal:/ {total=$2} /^SwapFree:/ {free=$2} END {printf "MemAvailable_kib=%d\nSwapUsed_kib=%d\n", available, total-free}' /proc/meminfo
              ps -eo pid=,ppid=,comm=,rss= | awk -v root="$typecheck_pid" '
                { pid[NR]=$1; parent[NR]=$2; command[NR]=$3; rss[NR]=$4 }
                END {
                  seen[root]=1
                  do {
                    changed=0
                    for (i=1; i<=NR; i++) {
                      if (seen[parent[i]] && !seen[pid[i]]) {
                        seen[pid[i]]=1
                        changed=1
                      }
                    }
                  } while (changed)
                  for (i=1; i<=NR; i++) {
                    if (seen[pid[i]] && command[i]=="node") {
                      printf "NodePID=%s NodeRSS_kib=%d\n", pid[i], rss[i]
                      total+=rss[i]
                    }
                  }
                  printf "NodeRSS_total_kib=%d\n", total
                }'
              available_kib=$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)
              if [ "$available_kib" -lt 1048576 ]; then
                echo 'WARNING: runner MemAvailable abaixo de 1 GiB'
              fi
              sleep 10
            done
          ) > "$metrics" 2>&1 &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true; wait "$monitor" 2>/dev/null || true' EXIT
          set +e
          wait "$typecheck_pid"
          code=$?
          set -e
          kill "$monitor" 2>/dev/null || true
          wait "$monitor" 2>/dev/null || true
          trap - EXIT
          {
            printf 'duration_seconds=%d\nexit_code=%d\n' "$(( $(date +%s) - started ))" "$code"
            awk -F= '
              $1=="MemAvailable_kib" { if (!seen || $2<minimum) minimum=$2; seen=1 }
              $1=="SwapUsed_kib" && $2>swap_peak { swap_peak=$2 }
              $1=="NodeRSS_total_kib" && $2>rss_peak { rss_peak=$2 }
              END { printf "minimum_MemAvailable_kib=%d\npeak_SwapUsed_kib=%d\npeak_NodeRSS_sampled_kib=%d\n", minimum, swap_peak, rss_peak }
            ' "$metrics"
          } > "$summary"
          printf '%s\n' "$code" > "$evidence/typecheck.exit-code"
          if [ "$code" -ne 0 ]; then
            echo 'Typecheck falhou; detalhe no artefato criptografado.' >&2
          fi
          exit "$code"

      - name: Gates estaticos de contribuicao
        id: static
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/feature-a-evidence"
          for gate in lint lint:channels lint:role-rank; do
            label=${gate//:/-}
            set +e
            pnpm "$gate" > "$evidence/$label.log" 2>&1
            code=$?
            set -e
            printf '%s\n' "$code" > "$evidence/$label.exit-code"
            if [ "$code" -ne 0 ]; then
              echo "Gate $gate falhou; detalhe no artefato criptografado." >&2
              exit "$code"
            fi
          done

      - name: Invariantes A1 de banco, grants e isolamento
        id: db
        continue-on-error: true
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/feature-a-evidence/db-a1.log"
          set +e
          pnpm test:db tests/invariants/meta-lead-por-clique.test.ts > "$log" 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > "$RUNNER_TEMP/feature-a-evidence/db-a1.exit-code"
          if [ "$code" -ne 0 ]; then
            echo 'Invariantes A1 de banco falharam; detalhe no artefato criptografado.' >&2
          fi
          exit "$code"

      - name: Build oficial do E2E
        id: build
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/feature-a-evidence/build.log"
          mem="$RUNNER_TEMP/feature-a-evidence/memory-build.log"
          (
            while :; do
              date -u +'%Y-%m-%dT%H:%M:%SZ'
              awk '/^(MemAvailable|SwapTotal|SwapFree):/ {print}' /proc/meminfo
              ps -eo pid,comm,rss --sort=-rss | head -n 8
              sleep 10
            done
          ) > "$mem" 2>&1 &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true' EXIT
          set +e
          pnpm e2e:build > "$log" 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > "$RUNNER_TEMP/feature-a-evidence/build.exit-code"
          if [ "$code" -ne 0 ]; then
            echo 'Build E2E falhou; detalhe no artefato criptografado.' >&2
            exit "$code"
          fi
          test -s .next/BUILD_ID
          test -d .next/server
          test -d .next/static
          test -s .next/required-server-files.json
          if grep -RqlE 'https://[A-Za-z0-9.-]+\.supabase\.co' .next/static; then
            echo 'Bundle contem host Supabase remoto.' >&2
            exit 1
          fi
          grep -RqlF '127.0.0.1:54321' .next/static
          echo 'Build e bundle local conferidos.'

      - name: Instalar Chromium e semear apenas as fixtures necessarias
        id: browser
        run: |
          set -euo pipefail
          pnpm exec playwright install --with-deps chromium > "$RUNNER_TEMP/feature-a-evidence/browser-install.log" 2>&1
          cp .env.e2e .env.local
          pnpm exec tsx scripts/seed-e2e-credentials.ts > "$RUNNER_TEMP/feature-a-evidence/seed-credentials.log" 2>&1
          pnpm exec tsx scripts/seed-e2e-nascimento-do-lead.ts > "$RUNNER_TEMP/feature-a-evidence/seed-nascimento.log" 2>&1
          echo 'Chromium e fixtures sintéticas prontos.'

      - name: Executar os dez cenarios causais isoladamente
        id: causal
        env:
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-causal
          AUTH_RATE_LIMIT_LOGIN_IP: "1000"
          META_ADS_GRAPH_BASE_URL: http://127.0.0.1:3995
          META_GRAPH_BASE_URL: http://127.0.0.1:9
          WAHA_WEBHOOK_REQUIRE_SIGNATURE: "true"
          WAHA_API_BASE_URL: http://127.0.0.1:3999
        run: |
          set -euo pipefail
          test "$META_ADS_GRAPH_BASE_URL" = 'http://127.0.0.1:3995'
          test "$META_GRAPH_BASE_URL" = 'http://127.0.0.1:9'
          test "$WAHA_WEBHOOK_REQUIRE_SIGNATURE" = 'true'
          test "$WAHA_API_BASE_URL" = 'http://127.0.0.1:3999'
          touch "$RUNNER_TEMP/feature-a-evidence/causal-started"
          set +e
          pnpm exec playwright test \
            tests/e2e/meta-lead-submitted-causal.spec.ts \
            --workers=1 --trace=on --reporter=list,html \
            --output=test-results-causal \
            > "$RUNNER_TEMP/feature-a-evidence/playwright-causal.log" 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > "$RUNNER_TEMP/feature-a-evidence/playwright-causal.exit-code"
          if [ "$code" -ne 0 ]; then
            echo 'Spec causal falhou; detalhe no artefato criptografado.' >&2
          fi
          exit "$code"

      - name: Repetir as duas specs de regressao com WAHA padrao
        id: regression
        if: ${{ !cancelled() && steps.browser.outcome == 'success' && steps.build.outcome == 'success' }}
        env:
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-regression
          AUTH_RATE_LIMIT_LOGIN_IP: "1000"
          META_ADS_GRAPH_BASE_URL: http://127.0.0.1:9
          META_GRAPH_BASE_URL: http://127.0.0.1:9
          WAHA_WEBHOOK_REQUIRE_SIGNATURE: "false"
          WAHA_API_BASE_URL: http://127.0.0.1:3999
        run: |
          set -euo pipefail
          test "$META_ADS_GRAPH_BASE_URL" = 'http://127.0.0.1:9'
          test "$META_GRAPH_BASE_URL" = 'http://127.0.0.1:9'
          test "$WAHA_WEBHOOK_REQUIRE_SIGNATURE" = 'false'
          test "$WAHA_API_BASE_URL" = 'http://127.0.0.1:3999'
          touch "$RUNNER_TEMP/feature-a-evidence/regression-started"
          set +e
          pnpm exec playwright test \
            tests/e2e/conversa-vira-lead.spec.ts \
            tests/e2e/conversoes-reprocessamento.spec.ts \
            --workers=1 --trace=on --reporter=list,html \
            --output=test-results-regression \
            > "$RUNNER_TEMP/feature-a-evidence/playwright-regression.log" 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > "$RUNNER_TEMP/feature-a-evidence/playwright-regression.exit-code"
          if [ "$code" -ne 0 ]; then
            echo 'Regressao falhou; detalhe no artefato criptografado.' >&2
          fi
          exit "$code"

      - name: Criptografar logs, resultados e traces
        id: encrypt
        if: ${{ always() && steps.encryption.outcome == 'success' }}
        run: |
          set -euo pipefail
          umask 077
          stage="$RUNNER_TEMP/feature-a-archive"
          mkdir -p "$stage"
          cp -R "$RUNNER_TEMP/feature-a-evidence" "$stage/logs"
          for dir in test-results-causal test-results-regression \
            playwright-report-causal playwright-report-regression; do
            if [ -d "$dir" ]; then cp -R "$dir" "$stage/"; fi
          done
          shot=evidence/spec-17/card-nascido-da-conversa.png
          if [ -f "$RUNNER_TEMP/feature-a-evidence/regression-started" ] \
            && [ -f "$shot" ] \
            && [ "$shot" -nt "$RUNNER_TEMP/feature-a-evidence/regression-started" ]; then
            mkdir -p "$stage/screenshots"
            cp "$shot" "$stage/screenshots/"
          fi
          if [ -n "$(find "$stage" -type f \( -name '.env.e2e' -o -name '.env.local' -o -name '.e2e-creds.json' \) -print -quit)" ]; then
            echo 'Arquivo de credenciais encontrado no pacote; upload recusado.' >&2
            exit 1
          fi
          tar -czf "$RUNNER_TEMP/feature-a-evidence.tar.gz" -C "$stage" .
          age -r "$EVIDENCE_RECIPIENT" \
            -o "$RUNNER_TEMP/feature-a-evidence.tar.gz.age" \
            "$RUNNER_TEMP/feature-a-evidence.tar.gz"
          test -s "$RUNNER_TEMP/feature-a-evidence.tar.gz.age"
          echo 'Evidencias criptografadas. Nenhum log ou trace bruto sera publicado.'

      - name: Publicar somente o pacote criptografado
        if: ${{ always() && steps.encrypt.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: feature-a-e2e-evidencias-criptografadas
          path: ${{ runner.temp }}/feature-a-evidence.tar.gz.age
          if-no-files-found: error
          retention-days: 14

      - name: Resumo sem credenciais
        if: always()
        env:
          TYPECHECK_RESULT: ${{ steps.typecheck.outcome }}
          STATIC_RESULT: ${{ steps.static.outcome }}
          DB_RESULT: ${{ steps.db.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          CAUSAL_RESULT: ${{ steps.causal.outcome }}
          REGRESSION_RESULT: ${{ steps.regression.outcome }}
          ENCRYPT_RESULT: ${{ steps.encrypt.outcome }}
        run: |
          {
            echo '## Feature A E2E'
            echo 'Checkpoint: `4d76349977ed5196a90c00722c240ae4764af747`'
            echo "Typecheck: ${TYPECHECK_RESULT}"
            echo "Gates estaticos: ${STATIC_RESULT}"
            echo "Banco A1: ${DB_RESULT}"
            echo "Build: ${BUILD_RESULT}"
            echo "Causal (dez cenarios): ${CAUSAL_RESULT}"
            echo "Regressao (duas specs): ${REGRESSION_RESULT}"
            echo "Criptografia: ${ENCRYPT_RESULT}"
            echo 'Artefato: pacote age; nenhum arquivo de ambiente ou credencial foi selecionado.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Exigir aprovacao dos invariantes A1
        if: always()
        env:
          DB_RESULT: ${{ steps.db.outcome }}
        run: test "$DB_RESULT" = success

  unitarios:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2, 3]
    env:
      CI: "true"
      EVIDENCE_RECIPIENT: ${{ inputs.evidence_recipient }}
    steps:
      - name: Checkout do mesmo commit do produto
        uses: actions/checkout@v7
        with:
          repository: oianmaxdev/DeskcommCRM
          ref: 4d76349977ed5196a90c00722c240ae4764af747
          persist-credentials: false

      - name: Conferir identidade e ambiente unitario limpo
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '4d76349977ed5196a90c00722c240ae4764af747'
          test -f supabase/migrations/MANIFEST.md
          test ! -e .env.local
          test ! -e .env.e2e
          for name in META_GRAPH_BASE_URL META_ADS_GRAPH_BASE_URL SUPABASE_DB_URL \
            NEXT_PUBLIC_SUPABASE_URL WAHA_API_BASE_URL; do
            if printenv "$name" >/dev/null; then
              echo "Variavel E2E indevida na suite unitaria: $name" >&2
              exit 1
            fi
          done

      - name: Preparar criptografia das evidencias unitarias
        id: encryption
        run: |
          set -euo pipefail
          umask 077
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq age >/dev/null
          mkdir -p "$RUNNER_TEMP/feature-a-unit-evidence"
          printf 'teste\n' | age -r "$EVIDENCE_RECIPIENT" \
            -o "$RUNNER_TEMP/feature-a-unit-evidence/recipient-probe.age"
          test -s "$RUNNER_TEMP/feature-a-unit-evidence/recipient-probe.age"

      - uses: ./.github/actions/preparar-node
        timeout-minutes: 5

      - name: Cercas estruturais do CI oficial
        if: matrix.parte == 3
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/feature-a-unit-evidence"
          set +e
          pnpm cercas > "$evidence/cercas.log" 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > "$evidence/cercas.exit-code"
          if [ "$code" -ne 0 ]; then
            echo 'Cercas estruturais falharam; detalhe no artefato criptografado.' >&2
          fi
          exit "$code"

      - name: Unit tests (parte ${{ matrix.parte }}/3)
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/feature-a-unit-evidence"
          set +e
          pnpm test:unit --project produto --shard=${{ matrix.parte }}/3 \
            > "$evidence/unit-parte-${{ matrix.parte }}.log" 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > "$evidence/unit-parte-${{ matrix.parte }}.exit-code"
          if [ "$code" -ne 0 ]; then
            echo 'Shard unitario falhou; detalhe no artefato criptografado.' >&2
          fi
          exit "$code"

      - name: Criptografar evidencias unitarias
        id: encrypt
        if: ${{ always() && steps.encryption.outcome == 'success' }}
        run: |
          set -euo pipefail
          umask 077
          evidence="$RUNNER_TEMP/feature-a-unit-evidence"
          tar -czf "$RUNNER_TEMP/feature-a-unit-${{ matrix.parte }}.tar.gz" -C "$evidence" .
          age -r "$EVIDENCE_RECIPIENT" \
            -o "$RUNNER_TEMP/feature-a-unit-${{ matrix.parte }}.tar.gz.age" \
            "$RUNNER_TEMP/feature-a-unit-${{ matrix.parte }}.tar.gz"
          test -s "$RUNNER_TEMP/feature-a-unit-${{ matrix.parte }}.tar.gz.age"

      - name: Publicar somente evidencias unitarias criptografadas
        if: ${{ always() && steps.encrypt.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: feature-a-unit-parte-${{ matrix.parte }}-evidencias-criptografadas
          path: ${{ runner.temp }}/feature-a-unit-${{ matrix.parte }}.tar.gz.age
          if-no-files-found: error
          retention-days: 14

  homologacao:
    runs-on: ubuntu-24.04
    needs: [feature-a-e2e, unitarios]
    if: always()
    env:
      E2E_RESULT: ${{ needs.feature-a-e2e.result }}
      UNIT_RESULT: ${{ needs.unitarios.result }}
    steps:
      - name: Exigir todos os gates obrigatorios
        run: |
          {
            echo '## Feature A A1 — resultado agregado'
            echo "E2E e banco: ${E2E_RESULT}"
            echo "Tres shards unitarios e cercas: ${UNIT_RESULT}"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$E2E_RESULT" = success
          test "$UNIT_RESULT" = success
